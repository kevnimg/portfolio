<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contacto — Kevin Moran</title>
<meta name="description" content="Contacta con Kevin Moran, diseñador gráfico especializado en branding. Hablemos de tu próximo proyecto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#393938;--text:#f5f5f5;--muted:#ccc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,Arial,sans-serif}
main{width:min(1000px,86%);margin:auto;padding:100px 0 75px}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 25px}
h1{font-size:clamp(48px,8vw,100px);line-height:1.1;font-weight:600;letter-spacing:-.055em;margin:0}
.intro{font-size:clamp(17px,2vw,23px);line-height:1.6;max-width:650px;margin:30px 0 55px;color:var(--muted)}
.contact{background:#fff;color:#222;padding:45px 48px;clip-path:polygon(0 0,calc(100% - 42px) 0,100% 42px,100% 100%,0 100%)}
.contact p{font-size:13px;margin:0 0 14px}.email{font-size:clamp(16px,2.7vw,30px);font-weight:500;color:inherit;text-decoration:none;overflow-wrap:anywhere}
.email:hover{text-decoration:underline;text-underline-offset:6px}
.actions{margin-top:32px}.button{display:inline-flex;align-items:center;gap:25px;min-height:48px;padding:12px 30px;background:#393938;color:#fff;text-decoration:none;font-size:15px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:background .2s}
.button:hover{background:#181818}.button:focus-visible{clip-path:none}
a:focus-visible{outline:3px solid #c48100;outline-offset:6px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:55px;border-top:1px solid #ffffff30;padding-top:23px;font-size:12px;color:var(--muted)}
@media(max-width:600px){main{width:88%;padding:55px 0 35px}.intro{margin:24px 0 35px}.contact{padding:32px 22px;clip-path:polygon(0 0,calc(100% - 25px) 0,100% 25px,100% 100%,0 100%)}footer{margin-top:35px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<p class="label">Contacto</p>
<h1>¿Hablamos?</h1>
<p class="intro">Si tienes un proyecto en mente o quieres conocer mejor mi trabajo, estaré encantado de hablar contigo.</p>
<section class="contact" aria-label="Contacto por correo electrónico">
<p>Puedes escribirme a</p>
<a class="email" href="mailto:kevinmorangarnacho@gmail.com" target="_blank">kevinmorangarnacho@gmail.com</a>
<div class="actions"><a class="button" href="mailto:kevinmorangarnacho@gmail.com" target="_blank">Escríbeme <span aria-hidden="true">↗</span></a></div>
</section>
<footer><span>Kevin Moran · Diseño &amp; branding</span><span>Barcelona</span></footer>
</main>
</body>
</html>
